apiVersion: v1
kind: Service
metadata:
  name: atlantis-node-port
  namespace: atlantis
spec:
  type: NodePort
  selector:
    app: atlantis
    release: atlantis
  ports:
    - name: http
      port: 80
      targetPort: 4141
      protocol: TCP
      nodePort: 30222